[package]
name = "webrtc-from-scratch"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["./packages/webrtc_rs", "./packages/eventloop"]

[dependencies]
bytes = "1"
notify-debouncer-full = "0.3.1"
zeromq = { version = "=0.5.0-pre", default-features = false, features = ["tokio-runtime", "ipc-transport"] }
tokio = { version = "1.32.0", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
rav1e = {  version = "0.8.0", path = "./crates/rav1e", package = "rav1e" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-traits = "0.2"
