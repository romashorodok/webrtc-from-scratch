[package]
name = "opus"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["experimental-async"]}
libc = "0.2.172"

[build-dependencies]
bindgen = "0.72.1"
cmake = "0.1.50"
